name: Publish

# Runs when a GitHub release is published. npm authenticates this workflow through
# trusted publishing (OIDC), so no npm token is stored in the repository.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # Required for npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # No dependency cache in release builds

      - run: npm ci

      - name: Lint, typings and tests
        run: npm run lint && npm run test:typings && npm test

      - name: Release tag must match package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi

      - name: Publish to npm
        run: |
          npm --version # Trusted publishing needs npm 11.5.1 or newer
          spec="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          # A version that is already on npm (for example the manual first release) is skipped, not an error
          if npm view "$spec" version > /dev/null 2>&1; then
            echo "$spec is already on npm, nothing to publish"
          else
            npm publish --access public
          fi
