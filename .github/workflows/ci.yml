name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typings and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      # None of the dependencies has an install script, so none is allowed to run
      - run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npx prettier --check "src/**/*.js" "typings/**/*.ts"

      - name: Typings
        run: npm run test:typings

      - name: Package contents
        run: npm pack --dry-run

  # The oldest Node version listed here must match "engines" in package.json
  test:
    name: Tests on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Package loads
        run: node -e "const { Client, version } = require('./'); new Client().destroy(); console.log('Loaded v' + version)"

      - name: Tests
        run: npm test
